# CCTV AI 에이전트 설정

site:
  name: "OO건설 1공구"
  address: "서울특별시 OO구 OO로 123"

models:
  pose: "yolo11n-pose.pt"   # 첫 실행 시 자동 다운로드
  helmet: null              # 예: "models/helmet.pt" (클래스: helmet / head)
  fire: null                # 예: "models/fire.pt"   (클래스: fire / smoke)
  fps: 0                    # 카메라별 초당 분석 프레임 상한. 0 = 장비가 허용하는 최대 속도
  display_fps: 15           # 화면에 보내는 영상 프레임 (분석 속도와 별개)
  conf: 0.25                # 사람 인식 최소 신뢰도. 낮을수록 쓰러진 사람처럼 애매한 자세도 잡지만 오인식 증가
  imgsz: 640                # AI 입력 크기. 작을수록 빠름 (480, 416, 320). 멀리 있는 사람은 놓칠 수 있음
  device: auto              # auto: NVIDIA GPU → 맥 GPU(mps) → CPU 순으로 자동 선택

# source: RTSP 주소, 영상 파일 경로, 웹캠 번호(0). 비워두면 화면에 데모 영상 표시
cameras:
  # 맥북 내장 카메라로 테스트하려면 cam01 의 source 를 "0" 으로
  # 유선 IP 카메라 예: "rtsp://admin:비밀번호@192.168.0.10:554/stream1"
  - { id: cam01, name: "정문 출입구",     source: "" }
  - { id: cam02, name: "자재 야적장",     source: "" }
  - { id: cam03, name: "타워크레인 하부", source: "" }
  - { id: cam04, name: "1층 작업장",      source: "" }
  - { id: cam05, name: "2층 작업장",      source: "" }
  - { id: cam06, name: "계단실",          source: "" }
  - { id: cam07, name: "지하 주차장",     source: "" }
  - { id: cam08, name: "후문",            source: "" }
  - { id: cam09, name: "가설 사무실",     source: "" }
  - { id: cam10, name: "옥상",            source: "" }
  - { id: cam11, name: "장비 주기장",     source: "" }
  - { id: cam12, name: "용접 작업장",     source: "" }

# 위험구역: 카메라 영상 픽셀 좌표 다각형
zones:
  cam03:
    크레인 작업반경: [[200, 300], [600, 300], [640, 480], [160, 480]]

situation:
  confirm_sec: 1.0      # 쓰러짐 의심 → 확정
  lying_confirm_sec: 3  # 넘어지는 순간을 놓쳤을 때, 누운 상태가 이만큼 지속되면 쓰러짐
  immobile_sec: 8       # 쓰러진 뒤 이 시간 동안 움직임 없으면 긴급(119)
  fire_confirm_frames: 5
  helmet_confirm_frames: 10
  event_cooldown_sec: 60

# AI 에이전트: 쓰러짐 등이 감지되면 장면 사진을 Gemini 에 보내 실제 위험인지 판단하고 신고 문장을 작성
# API 키는 여기 쓰지 말고 backend/.env 의 GEMINI_API_KEY 에 넣는다 (.env.example 참고)
agent:
  enabled: true
  model: gemini-flash-latest   # 빠른 영상 이해 모델. 예: gemini-3.8-flash, gemini-2.5-flash
  timeout_sec: 15

emergency:
  countdown_sec: 15     # 관리자 취소 가능 시간, 지나면 자동 신고
  channels:
    - type: mock
    # - type: webhook
    #   url: "https://관제업체/api/alarm"
    # - type: sms
    #   recipients: ["010-0000-0000"]   # 현장 안전관리자
