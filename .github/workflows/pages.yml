# web-demo 폴더를 GitHub Pages 사이트로 배포 (크롬에서 https 주소로 열려 웹캠 사용 가능)
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source 를 "GitHub Actions" 로 선택
name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [claude/cctv-ai-agent-n2xy5n, main]
    paths: ["web-demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-demo
      - id: deployment
        uses: actions/deploy-pages@v4
